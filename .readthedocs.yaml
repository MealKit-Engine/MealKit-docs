# Read the Docs build. The English project (mealkit) and the Korean one (its translation, project language "ko") both use this file;
# Read the Docs passes the project's language to Sphinx, which picks locale/ko for the Korean one.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: conf.py
  fail_on_warning: true

python:
  install:
    - requirements: requirements.txt
