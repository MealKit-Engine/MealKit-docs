# MealKit 문서 CI: 영어·한국어 빌드(경고 = 오류), 번역 검사(미번역·fuzzy 0), 엔진 버전 비교, 바깥 링크 검사.
name: docs
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ENGINE_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # 엔진 저장소의 VERSION과 비교한다. 엔진 저장소가 비공개인 동안은 ENGINE_REPO_TOKEN 비밀 값이 있어야 받는다.
      - uses: actions/checkout@v4
        if: ${{ env.ENGINE_TOKEN != '' }}
        with:
          repository: KingProtea99/MealKit
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Build and check
        run: |
          if [ -f engine/VERSION ]; then python tools/build.py check --engine engine; else python tools/build.py check; fi
      - name: Link check
        run: python tools/build.py linkcheck
      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: _build/html
