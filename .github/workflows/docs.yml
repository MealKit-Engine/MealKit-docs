# MealKit docs CI: English/Korean builds (warnings = errors), translation checks (0 untranslated/fuzzy), engine version comparison, external link checks.
name: docs
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Compared with the engine repo's VERSION; cookbook code is compared with the sample files it comes from
      - uses: actions/checkout@v7
        with:
          repository: MealKit-Engine/MealKit
          path: engine
          sparse-checkout: |
            VERSION
            samples/*/sim/
            samples/*/view/
            samples/*/app/
            samples/*/assets/*.table
            samples/*/assets/*.bindings
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Build and check
        run: |
          if [ -f engine/VERSION ]; then python tools/build.py check --engine engine; else python tools/build.py check; fi
      - name: Link check
        run: python tools/build.py linkcheck
      - uses: actions/upload-artifact@v7
        with:
          name: html
          path: _build/html
